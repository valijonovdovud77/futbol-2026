<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>3D Futbol 2026</title>
<style>
body {
  margin: 0;
  overflow: hidden;
}
</style>
</head>
<body>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
  60, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.set(0, 16, 22);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x446644, 2));

const grass = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 30),
  new THREE.MeshStandardMaterial({color:0x16852b})
);
grass.rotation.x = -Math.PI / 2;
scene.add(grass);

const lineMaterial = new THREE.LineBasicMaterial({
  color: 0xffffff
});

function line(x1,z1,x2,z2) {
  const points = [
    new THREE.Vector3(x1,0.03,z1),
    new THREE.Vector3(x2,0.03,z2)
  ];
  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(points),
    lineMaterial
  ));
}

line(-10,-15,10,-15);
line(-10,15,10,15);
line(-10,-15,-10,15);
line(10,-15,10,15);
line(-10,0,10,0);

const ball = new THREE.Mesh(
  new THREE.SphereGeometry(0.5,32,32),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
ball.position.set(0,0.5,0);
scene.add(ball);

function animate() {
  requestAnimationFrame(animate);
  ball.rotation.x += 0.01;
  renderer.render(scene,camera);
}
animate();

</script>
</body>
</html>
